# Add this `location` block inside the existing `server { ... }` block for
# tool.selinnaowen.com in your Nginx config (likely something like
# /etc/nginx/sites-available/tool.selinnaowen.com).
#
# Place it alongside (not nested inside) any existing location blocks for
# other tools, e.g. /split-bill.

location /spending-tracker {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# After adding this block:
#   sudo nginx -t              # validate config
#   sudo systemctl reload nginx
